services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=gradientrip
      - POSTGRES_PASSWORD=changeme-in-prod
      - POSTGRES_DB=gradientrip
    ports:
      - "5434:5432"
    volumes:
      - gradientrip-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradientrip -d gradientrip"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://gradientrip:changeme-in-prod@db:5432/gradientrip
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: worker
    command: npm run worker
    environment:
      - DATABASE_URL=postgresql://gradientrip:changeme-in-prod@db:5432/gradientrip
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=gradientrip-media
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address :9001
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - gradientrip-minio-data:/data
    restart: unless-stopped

volumes:
  gradientrip-pgdata:
  gradientrip-minio-data:
